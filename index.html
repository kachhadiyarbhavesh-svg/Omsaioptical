<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Om Sai Optical - Navigation Bar</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  background: #080808;
  color: #fff;
  min-height: 100vh;
}

/* =========================================
   NAVBAR & HOVER EFFECTS CSS
========================================= */

.custom-navbar-header {
  position: sticky;
  top: 0;
  left: 0;
  width: 100%;
  background: rgba(12, 12, 12, 0.85);
  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);
  border-bottom: 1px solid rgba(212, 175, 55, 0.35);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 15px rgba(212, 175, 55, 0.1);
  z-index: 1000;
  transition: all 0.3s ease;
}

.nav-container {
  width: 90%;
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 0;
}

/* 1. Brand Logo Hover Effect */
.brand-logo {
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 21px;
  font-weight: 800;
  color: #fff;
  letter-spacing: 0.5px;
  transition: transform 0.3s ease, filter 0.3s ease;
}

.brand-logo .om-symbol {
  color: #ffd700;
  font-size: 24px;
  transition: transform 0.4s ease;
}

.brand-logo:hover {
  transform: scale(1.03);
  filter: drop-shadow(0 0 12px rgba(255, 215, 0, 0.6));
}

.brand-logo:hover .om-symbol {
  transform: rotate(15deg) scale(1.1);
}

/* 2. Menu Links with Animated Glow Underlines */
.nav-menu ul {
  display: flex;
  list-style: none;
  gap: 28px;
  align-items: center;
}

.nav-link {
  position: relative;
  text-decoration: none;
  color: #d6d6d6;
  font-size: 14.5px;
  font-weight: 500;
  padding: 6px 0;
  transition: color 0.3s ease;
}

/* Expanding glowing line on hover */
.nav-link::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 50%;
  width: 0%;
  height: 2px;
  background: linear-gradient(90deg, #ffd700, #d4af37);
  box-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
  transition: width 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), left 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
}

.nav-link:hover {
  color: #ffd700;
  text-shadow: 0 0 12px rgba(255, 215, 0, 0.6);
}

.nav-link:hover::after,
.nav-link.active::after {
  width: 100%;
  left: 0;
}

/* 3. Action Buttons with 3D Depth & Glow */
.nav-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}

.btn-nav-call {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  background: rgba(255, 255, 255, 0.06);
  color: #ffd700;
  border: 1px solid rgba(212, 175, 55, 0.5);
  border-radius: 20px;
  text-decoration: none;
  font-size: 13px;
  font-weight: 600;
  transition: all 0.3s ease;
}

.btn-nav-call:hover {
  background: #ffd700;
  color: #000;
  box-shadow: 0 0 18px rgba(255, 215, 0, 0.7);
  transform: translateY(-2px);
}

.btn-nav-wa {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 18px;
  background: #25d366;
  color: #fff;
  border-radius: 20px;
  text-decoration: none;
  font-size: 13px;
  font-weight: 700;
  box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
  transition: all 0.3s ease;
}

.btn-nav-wa:hover {
  background: #1ebc59;
  box-shadow: 0 6px 22px rgba(37, 211, 102, 0.7);
  transform: translateY(-2px) scale(1.03);
}

/* 4. Mobile Hamburger Button */
.nav-toggle-btn {
  display: none;
  flex-direction: column;
  justify-content: space-between;
  width: 26px;
  height: 19px;
  background: transparent;
  border: none;
  cursor: pointer;
  padding: 0;
}

.nav-toggle-btn span {
  display: block;
  width: 100%;
  height: 2.5px;
  background: #ffd700;
  border-radius: 2px;
  transition: all 0.3s ease;
}

/* Mobile Menu Dropdown */
.mobile-dropdown {
  display: none;
  flex-direction: column;
  background: rgba(8, 8, 8, 0.98);
  border-top: 1px solid rgba(212, 175, 55, 0.3);
  padding: 20px 5%;
  gap: 15px;
}

.mobile-dropdown.active {
  display: flex;
}

.mobile-dropdown a {
  text-decoration: none;
  color: #e0e0e0;
  font-size: 15px;
  font-weight: 500;
  transition: color 0.3s ease;
}

.mobile-dropdown a:hover {
  color: #ffd700;
}

/* Responsive Styles */
@media (max-width: 880px) {
  .nav-menu, .nav-actions {
    display: none;
  }
  .nav-toggle-btn {
    display: flex;
  }
}
</style>
</head>
<body>

<header class="custom-navbar-header">
  <div class="nav-container">
    
    <a href="#" class="brand-logo">
      <span class="om-symbol">ॐ</span> Om Sai Optical
    </a>

    <nav class="nav-menu">
      <ul>
        <li><a href="#" class="nav-link active">Home</a></li>
        <li><a href="#services" class="nav-link">Services</a></li>
        <li><a href="#products" class="nav-link">Products</a></li>
        <li><a href="#gallery" class="nav-link">Gallery</a></li>
        <li><a href="#contact" class="nav-link">Contact</a></li>
      </ul>
    </nav>

    <div class="nav-actions">
      <a href="tel:09662504082" class="btn-nav-call">
        📞 096625 04082
      </a>
      <a href="https://wa.me/919662504082" target="_blank" class="btn-nav-wa">
        💬 WhatsApp
      </a>
    </div>

    <button class="nav-toggle-btn" id="navToggle" aria-label="Toggle navigation">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>

  <div class="mobile-dropdown" id="mobileDropdown">
    <a href="#" onclick="closeMobileNav()">Home</a>
    <a href="#services" onclick="closeMobileNav()">Services</a>
    <a href="#products" onclick="closeMobileNav()">Products</a>
    <a href="#gallery" onclick="closeMobileNav()">Gallery</a>
    <a href="#contact" onclick="closeMobileNav()">Contact</a>
    <a href="tel:09662504082" style="color: #ffd700; font-weight: 600;">📞 Call: 096625 04082</a>
    <a href="https://wa.me/919662504082" target="_blank" style="color: #25d366; font-weight: 600;">💬 WhatsApp Inquiry</a>
  </div>
</header>

<script>
  const navToggle = document.getElementById('navToggle');
  const mobileDropdown = document.getElementById('mobileDropdown');

  navToggle.addEventListener('click', () => {
    mobileDropdown.classList.toggle('active');
  });

  function closeMobileNav() {
    mobileDropdown.classList.remove('active');
  }
</script>

</body>
</html>
